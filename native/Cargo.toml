[package]
name = "wizq-native"
version = "6.0.0-beta.1"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "wizq_native"
crate-type = ["cdylib"]

[features]
default = ["pyo3"]
pyo3 = []

[dependencies]
pyo3 = { version = "=0.22.6", features = ["extension-module"] }
serde_json = "=1.0.145"
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }
