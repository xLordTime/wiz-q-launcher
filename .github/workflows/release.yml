name: Version 6 Release
on:
  push:
    tags: ["v6*"]
    branches: ["Version-6.0"]
permissions:
  contents: write
jobs:
  release:
    # Release commits and tags use the same Windows verification pipeline.
    if: "${{ startsWith(github.ref, 'refs/tags/v6') || startsWith(github.event.head_commit.message, 'release: ') }}"
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install ./native
      - name: Resolve version and publication mode
        id: version
        shell: pwsh
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $appVersion = python -c "from wizq import __version__; print(__version__)"
          $expectedTag = "v$appVersion"
          $preRelease = python -c "from wizq import __version__; from packaging.version import Version; print(str(Version(__version__).is_prerelease).lower())"
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag does not match application version."
          }
          $headTitle = ($env:RELEASE_COMMIT_MESSAGE -split "\r?\n", 2)[0]
          $publishStable = $preRelease -eq "false" -and $headTitle -ceq "release: publish $expectedTag"
          if ($env:GITHUB_REF_TYPE -ne "tag" -and $preRelease -ne "true" -and -not $publishStable) {
            throw "A stable branch release requires the exact commit title: release: publish $expectedTag"
          }
          "publish_stable=$($publishStable.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$expectedTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$preRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Validate
        run: |
          python -m ruff check wizq main.py tests scripts/build.py
          python -m pytest -q
      - name: Test native login pattern validation
        shell: pwsh
        run: |
          rustc --edition 2021 --test native/src/patterns.rs -o native-pattern-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\native-pattern-tests.exe
      - name: Package
        run: |
          python build.py
          python -m scripts.smoke_frozen
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content release/SHA256SUMS.txt
          }
      - uses: softprops/action-gh-release@v2
        with:
          name: Wiz Q Launcher ${{ steps.version.outputs.tag }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ steps.version.outputs.prerelease != 'true' && steps.version.outputs.publish_stable != 'true' }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.version.outputs.publish_stable == 'true' }}
          overwrite_files: false
          body_path: documentation/V6_RELEASE_NOTES.md
          files: release/*

