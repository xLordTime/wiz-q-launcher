name: Version 6 Release
on:
  push:
    tags: ["v6*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install ./native
      - name: Check tag matches application version
        shell: pwsh
        run: |
          python -c "from wizq import __version__; import os; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__"
      - name: Validate
        run: |
          python -m ruff check wizq main.py tests scripts/build.py
          python -m pytest -q
      - name: Package
        run: |
          python build.py
          python -m scripts.smoke_frozen
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Add-Content release/SHA256SUMS.txt
          }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/SHA256SUMS.txt

