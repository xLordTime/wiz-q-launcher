name: Release

# Triggered when a version tag is pushed: git tag v5.2.1 && git push origin v5.2.1
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # ── 1. Source ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Dependencies ────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 4. Build .exe ──────────────────────────────────────────────────────
      - name: Build executable with PyInstaller
        run: |
          pyinstaller `
            --noconfirm `
            --onefile `
            --windowed `
            --name "WizQLauncher" `
            --icon "icon.ico" `
            --add-data "icon.ico;." `
            --add-data "LICENSE;." `
            --add-data "README.md;." `
            --hidden-import "PySimpleGUI" `
            --hidden-import "cryptography" `
            --hidden-import "cryptography.hazmat.primitives.kdf.scrypt" `
            --hidden-import "psutil" `
            --hidden-import "requests" `
            --hidden-import "packaging" `
            --hidden-import "packaging.version" `
            --hidden-import "pypresence" `
            --hidden-import "pystray" `
            --hidden-import "PIL" `
            --hidden-import "PIL.Image" `
            --hidden-import "win32gui" `
            --hidden-import "win32con" `
            --hidden-import "win32api" `
            --hidden-import "winreg" `
            --hidden-import "wizwalker" `
            main.py

      # ── 5. Rename artifact to include version tag ──────────────────────────
      - name: Rename artifact
        run: |
          $tag = "${{ github.ref_name }}"
          Move-Item "dist\WizQLauncher.exe" "dist\WizQLauncher-$tag.exe"

      # ── 6. Create GitHub Release + upload .exe ─────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Wiz Q Launcher ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: dist/WizQLauncher-${{ github.ref_name }}.exe
